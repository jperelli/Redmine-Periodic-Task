      <stop offset="0" stop-color="#d23e3e"/>
      <stop offset="1" stop-color="#8f1c1c"/>
    </linearGradient>
  </defs>
  <!-- rounded background -->
  <rect x="8" y="8" width="240" height="240" rx="52" fill="url(#bg)"/>

  <!-- circular repeat arrows -->
