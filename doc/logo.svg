    <path d="M 62 108 A 70 70 0 0 1 178 78"/>
    <path d="M 194 148 A 70 70 0 0 1 78 178"/>
  </g>
  <g fill="#fff">
    <polygon points="178,52 200,84 164,88"/>
    <polygon points="78,204 56,172 92,168"/>
  </g>

  <!-- calendar / task card -->
  <rect x="96" y="96" width="64" height="64" rx="10" fill="#fff"/>
  <rect x="96" y="96" width="64" height="18" rx="10" fill="#ffd0d0"/>
  <rect x="96" y="106" width="64" height="8" fill="#ffd0d0"/>
  <rect x="108" y="88" width="8" height="18" rx="4" fill="#fff"/>
  <rect x="140" y="88" width="8" height="18" rx="4" fill="#fff"/>
  <!-- check mark -->
  <path d="M 112 136 L 124 148 L 146 124" fill="none" stroke="#b02525" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
